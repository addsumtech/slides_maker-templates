.btn.primary { background:var(--ink); color:#fff; border:1px solid var(--ink); }
.btn.primary:hover { background:var(--accent); border-color:var(--accent); }

  footer .inner { gap:12px; font-size:12px; } footer .sp { flex-basis:100%; }
}

<script>
const STR = {
  en: {
    byline:'by <a href="https://addsum.top/?lang=en">Addsum</a>',
    headline:'Your material. An editable presentation.',
    lede:'Use slide-maker to turn papers, code and documents into a PowerPoint you can keep editing. Start with the video, then choose a template for your own material.',
    vlBtn:'Template library', vlShort:'Templates',
    vTitle:'See how it works',
    vLede:'A three-minute walkthrough: provide your material, confirm the plan, build the slides and review the result. English narration with captions.',
    startLink:'Installation and usage',
    footText:'Produced by Addsum',
    title:'slide-maker | Editable PPT & Template Library'
  },
  zh: {
    byline:'<a href="https://addsum.top/cn/">增和科技 Addsum</a> 出品',
    headline:'从你的材料，到可编辑的 PPT。',
    lede:'使用 slide-maker，读取论文、代码或文档，整理内容、设计页面，生成可继续修改的 PowerPoint。先看视频了解流程，再选一套适合你的模板。',
    vlBtn:'模板库', vlShort:'模板库',
    vTitle:'3 分钟，看懂制作流程',
    vLede:'从提供材料、确认方案，到生成页面、预览评审，看看一份 PPT 是怎么做出来的。',
    startLink:'安装与使用说明',
    footText:'增和科技 Addsum 出品',
    title:'slide-maker | 可编辑 PPT 与模板库'
  }
};
function setLang(lang) {
  const t = STR[lang];
  if (history.replaceState) {   // the page's own language markers go; a library search or #vl-<language> stays
    var ps = new URLSearchParams(location.search); ps.delete('lang');
    var qs = ps.toString(), hs = (location.hash === '#zh' || location.hash === '#en') ? '' : location.hash;
    history.replaceState(null, '', (lang === 'zh' ? '/cn/' : '/') + (qs ? '?' + qs : '') + hs);
  }
  var fh = document.getElementById('footHome');
  if (fh) fh.href = lang === 'zh' ? 'https://addsum.top/cn/' : 'https://addsum.top/?lang=en';
  const lb = document.getElementById('langBtn');
  if (lb) { lb.textContent = lang === 'zh' ? 'EN' : '中文'; lb.setAttribute('aria-label', lang === 'zh' ? 'Switch to English' : '切换为中文'); lb.onclick = () => { try { localStorage.setItem('addsum-lang', lang === 'zh' ? 'en' : 'zh'); } catch(e){} setLang(lang === 'zh' ? 'en' : 'zh'); }; }
  for (const k of ['byline','headline','lede','vTitle','vLede','startLink','footText']) {
    const el = document.getElementById(k);
    if (el) el.innerHTML = t[k];
  }
  const vid = document.getElementById('introVid');
  if (vid) {
    const cur = `/docs/assets/slide-maker-intro-${lang}.mp4`;
    if (!vid.src.endsWith(cur)) {
      vid.pause();
      vid.setAttribute('poster', `/docs/assets/intro-poster-${lang}.jpg`);
      vid.src = cur;
      vid.load();
    }
  }
  document.getElementById('startLink').href = lang === 'zh' ? 'https://github.com/addsumtech/slides_maker/blob/main/README_CN.md#快速开始' : 'https://github.com/addsumtech/slides_maker#quick-start';
  const vb = document.getElementById('vlBtn');
  if (vb) { vb.querySelector('.full').textContent = t.vlBtn; vb.querySelector('.short').textContent = t.vlShort; }
  document.title = t.title;
  document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';
  if (window.slideMakerLibrary) window.slideMakerLibrary.setLang(lang);   // keep the library in the same language
}
(function(){
  function mark(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(!a) return;
    try{
      var u = new URL(a.getAttribute('href'), location.href);
      if(/\.addsum\.top$/.test(u.hostname) && u.hostname !== location.hostname){
        var l = document.documentElement.getAttribute('lang') || 'en';
        document.cookie = 'xlang=' + (l.indexOf('zh') === 0 ? 'zh' : 'en') + '; domain=.addsum.top; path=/; max-age=60';
      }
    }catch(err){}
  }
  document.addEventListener('mousedown', mark, true);
  document.addEventListener('click', mark, true);
})();
(function(){
  var stored=null; try { stored=localStorage.getItem('addsum-lang'); } catch(e){}
  var lang;
  var q=null; try { q=new URLSearchParams(location.search).get('lang'); } catch(e){}
  var xl=(document.cookie.match(/(?:^|;\s*)xlang=(en|zh)/)||[])[1];
  if (xl) { try { document.cookie='xlang=; domain=.addsum.top; path=/; max-age=0'; } catch(e){} }
  if (q === 'zh' || q === 'en') lang=q; /* URL 参数最高优先 */
  else if (location.pathname.indexOf('/cn') === 0) lang='zh';
  else if (xl === 'zh' || xl === 'en') lang=xl; /* 站间跳转语言意图走 cookie */
  else if (location.hash === '#zh') lang='zh';
  else if (location.hash === '#en') lang='en';
  else if (stored==='zh'||stored==='en') lang=stored;
  else lang=/^zh/i.test((navigator.languages&&navigator.languages[0])||navigator.language||'') ? 'zh' : 'en';
  setLang(lang);
})();
</script>
